<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSS EXTERNO -->
     <link rel="stylesheet" href="./src/css/estilo.css">
    <title>CityBets</title>
</head>
<body>
   <header>
            <h1>CITYBETS<span>2026</span></h1>
    </header>

    <main class="container">
        <h2>Próximas Partidas</h2>

        <section class="grid-partidas">
            <article class="card">
                <h5 id="times1">Brasil vs Haiti</h5>
                <p id="horarios1">20/06 - 21:30</p>
                <div class="input-partida">
                    <input type="number" min="0" max="10" placeholder="Brasil" id="time1-1">
                    <input type="number" min="0" max="10" placeholder="Haiti" id="time2-1">
                </div>
                <button  class="btn-palpite">Palpite</button>
            </article>

            <article class="card">
                <h5 id="times2">Holanda vs Japão</h5>
                <p id="horarios2">16/06 - 16:00</p>
                <div class="input-partida">
                    <input type="number" placeholder="Holanda" id="time1-2">
                    <input type="number" placeholder="Japão" id="time2-2">
                </div>
                <button class="btn-palpite">Palpite</button>
            </article>
        </section>

        <section class="historico">
            <h3>Histórico de Palpites</h3>
            <ul id="lista-resultados"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026-Bolão</p>
    </footer>

    
</body>
</html>
